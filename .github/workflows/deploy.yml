name: ?? Production Deploy (Tags Trigger)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Specific Tag to Deploy (leave empty for latest ref)'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ?? Deploy Autonomous Research Agent to VPS
    runs-on: ubuntu-latest
    steps:
      - name: ?? Checkout Code
        uses: actions/checkout@v4

      - name: ?? Verify Required Secrets
        id: check_secrets
        run: |
          MISSING=""
          if [ -z "${{ secrets.SSH_HOST }}" ]; then MISSING="$MISSING SSH_HOST"; fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then MISSING="$MISSING SSH_USER"; fi
          if [ -z "${{ secrets.SSH_KEY }}" ]; then MISSING="$MISSING SSH_KEY"; fi
          if [ -z "${{ secrets.DOPPLER_TOKEN }}" ]; then MISSING="$MISSING DOPPLER_TOKEN"; fi

          if [ -n "$MISSING" ]; then
            echo "? Missing required GitHub Secrets: $MISSING"
            echo "Please configure them in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "? All required deployment secrets are present."

      - name: ??? Determine Target Tag / Version
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="main"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "?? Target deployment tag: $TAG"

      - name: ?? Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_TAG: ${{ steps.get_tag.outputs.tag }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          TARGET_DIR: ${{ secrets.TARGET_DIR || '/root/Projects/lang' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: TARGET_TAG,DOPPLER_TOKEN,TARGET_DIR
          script: |
            set -e
            echo "========================================================"
            echo "?? Deploying Autonomous Research Agent [$TARGET_TAG]"
            echo "========================================================"

            # 1. Pastikan direktori target ada
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # 2. Pastikan Doppler CLI terpasang di VPS
            if ! command -v doppler &> /dev/null; then
              echo "?? Installing Doppler CLI on VPS..."
              curl -Ls https://cli.doppler.com/install.sh | sh
            fi

            # 3. Sinkronisasi repository ke git tag target
            if [ -d ".git" ]; then
              echo "?? Fetching latest tags from remote..."
              git fetch --all --tags --prune
              git checkout "$TARGET_TAG"
            else
              echo "?? Git directory not initialized in $TARGET_DIR. Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git .
              git checkout "$TARGET_TAG"
            fi

            # 4. Unduh secrets produksi dari Doppler ke .env
            echo "?? Fetching production secrets from Doppler..."
            doppler secrets download --token="$DOPPLER_TOKEN" --no-file --format env > .env
            chmod 600 .env

            # 5. Pastikan shared network tirenn-net ada
            docker network create tirenn-net 2>/dev/null || true

            # 6. Build dan jalankan container
            echo "?? Building and starting containers..."
            docker compose up -d --build --remove-orphans

            # 7. Tunggu healthcheck
            echo "? Verifying service health..."
            timeout 45s bash -c '
              until docker compose ps | grep -q "(healthy)"; do
                sleep 2
              done
            ' || true

            # 8. Verifikasi container
            echo "========================================================"
            echo "? Deployment Successful! Running Containers:"
            echo "========================================================"
            docker compose ps
